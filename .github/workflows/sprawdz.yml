# Sprawdzenie przy każdej zmianie (darmowe, na GitHubie): test API na prawdziwej bazie MariaDB i PHP 7.4 (jak na LH.pl).
# Gdy dojdzie aplikacja: tu też TypeScript, lint i testy logiki.
name: Sprawdź kod
on:
  push:
  pull_request:
jobs:
  serwer:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_mysql, mbstring, curl
      - name: Składnia PHP
        run: for f in server/*.php server/lib/*.php server/testy/*.php server/testy/mock/*.php; do php -l "$f"; done
      - name: Test API
        run: sh server/testy/uruchom.sh 127.0.0.1 root root
