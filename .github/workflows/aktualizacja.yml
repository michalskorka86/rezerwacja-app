# Aktualizacja „w powietrzu” (EAS Update) — bez budowania i instalowania APK. Uruchamia się:
#  - SAMA po wysłaniu na main commita z „[aktualizacja]” w opisie (opis = tytuł commita),
#  - albo ręcznie: Actions → „Wyślij aktualizację” → Run workflow.
# Telefony pobierają ją same (przy starcie / po powrocie do aplikacji po 10 min).
# Dochodzi tylko do APK z tymi samymi modułami systemowymi — gdy doszedł nowy moduł, potrzebny nowy APK („[apk]”).
# Wymaga sekretów EXPO_TOKEN i GOOGLE_SERVICES_JSON (plik z Firebase — ten sam odcisk modułów w APK i aktualizacjach).
name: Wyślij aktualizację
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      opis:
        description: 'Co się zmieniło (krótko)'
        type: string
        default: 'Poprawki'
jobs:
  aktualizuj:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[aktualizacja]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: google-services.json z sekretu (nie trafia do repozytorium)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then echo "::error::Brak sekretu GOOGLE_SERVICES_JSON (Settings → Secrets and variables → Actions → Repository secrets)"; exit 1; fi
          printf '%s' "$GS" > google-services.json
          node -e '
            const t = require("fs").readFileSync("google-services.json", "utf8");
            let j;
            try { j = JSON.parse(t); } catch (e) { console.log("::error::GOOGLE_SERVICES_JSON to nie jest poprawny plik JSON (" + t.length + " znaków, początek: " + JSON.stringify(t.slice(0, 1)) + "): " + e.message); process.exit(1); }
            const pk = (j.client || []).map((c) => c.client_info?.android_client_info?.package_name);
            if (!pk.includes("pl.silt.rezerwacje")) { console.log("::error::W google-services.json nie ma aplikacji pl.silt.rezerwacje (są: " + pk.join(", ") + ")"); process.exit(1); }
            console.log("google-services.json OK");
          '
      - name: Wyślij do EAS Update (kanał preview = APK z GitHuba)
        env:
          OPIS: ${{ inputs.opis }}
        run: |
          [ -n "$OPIS" ] || OPIS="$(git log -1 --format=%s | sed 's/\[aktualizacja\]//' | xargs)"
          eas update --platform android --channel preview --message "$OPIS" --non-interactive
